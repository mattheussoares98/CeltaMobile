workflows:
  release-workflow:
    name: Tag Release Workflow
    instance_type: mac_mini_m2 # Fixed the slug name
    integrations:
      app_store_connect: "Celta mobile" # Replace with the name from Codemagic UI
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: '*'
    environment:
      flutter: 3.41.1
      xcode: latest
      groups:
        - android_credentials
        - ios_credentials
      vars:
        BUNDLE_ID: "br.com.celtaware.inventario"
      ios_signing:
        provisioning_profiles:
          - celta mobile
        certificates:
          - CodeMagic distribution
      android_signing:
        - celtaMobile

    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install FlutterFire CLI
        script: dart pub global activate flutterfire_cli
      - name: Generate Code
        script: |
          # Clean old generated files and metadata first
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          dart run build_runner clean
          dart run build_runner build --delete-conflicting-outputs
      # - name: Run Tests
      #   script: flutter test
      #   ignore_failure: true
      # - name: Build Android AAB
      #   script: flutter build appbundle
      - name: Build iOS IPA
        script: flutter build ipa --no-codesign --export-method development

    artifacts:
      # - build/app/outputs/bundle/release/*.aab
      - build/ios/iphoneos/*.app

    publishing:
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      app_store_connect:
        auth: integration
        submit_to_testflight: true