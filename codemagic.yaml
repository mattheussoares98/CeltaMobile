workflows:
  release-workflow:
    name: Tag Release Workflow
    instance_type: mac_mini_m2 # Fixed the slug name
    integrations:
      app_store_connect: "Celta mobile" # Replace with the name from Codemagic UI
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: '*'
    environment:
      flutter: 3.41.1
      xcode: latest
      groups:
        - android_credentials
        - ios_credentials
      vars:
        BUNDLE_ID: "br.com.celtaware.inventario"
      ios_signing:
        provisioning_profiles:
          - celta mobile
        certificates:
          - CodeMagic distribution
      android_signing:
        - celtaMobile

    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install FlutterFire CLI
        script: dart pub global activate flutterfire_cli
      - name: Generate Code
        script: |
          # Clean old generated files and metadata first
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          dart run build_runner clean
          dart run build_runner build --delete-conflicting-outputs
      # - name: Run Tests
      #   script: flutter test
      #   ignore_failure: true
      # - name: Build Android AAB
      #   script: flutter build appbundle
      - nname: Set up code signing
        script: |
          keychain initialize
          # We provide the Bundle ID explicitly as required by your CLI version
          # and specify the type to ensure it gets the Distribution profile.
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE
          
      - name: Build iOS
        script: |
          # We build the 'ios' bundle. This is the most stable command.
          # It generates the Runner.app which Codemagic can then sign.
          flutter build ios --release --no-codesign --build-number=$BUILD_NUMBER

    artifacts:
      # - build/app/outputs/bundle/release/*.aab
      - build/ios/iphoneos/*.app

    publishing:
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      app_store_connect:
        auth: integration
        submit_to_testflight: true