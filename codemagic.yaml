workflows:
  release-workflow:
    name: Tag Release Workflow
    instance_type: mac_mini_m2 # Fixed the slug name
    integrations:
      app_store_connect: "Celta mobile" # Replace with the name from Codemagic UI
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: '*'
    environment:
      flutter: 3.41.1
      xcode: latest
      groups:
        - android_credentials
        - ios_credentials
      vars:
        BUNDLE_ID: "br.com.celtaware.inventario"
      ios_signing:
        provisioning_profiles:
          - Celta mobile AppStore
        certificates:
          - CeltaMobile publish
        distribution_type: app_store
      android_signing:
        - celtaMobile

    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install FlutterFire CLI
        script: dart pub global activate flutterfire_cli
      - name: Generate Code
        script: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          dart run build_runner build --delete-conflicting-outputs

      - name: Setup keychain
        script: |
          keychain initialize
          keychain add-certificates

      - name: Debug provisioning profile details
        script: |
          PROFILE=$(ls -1 ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n 1)
          echo "Using profile file: $PROFILE"
          security cms -D -i "$PROFILE" | plutil -p - | grep -E '"Name"|UUID|aps-environment|application-identifier' || true    

      - name: Debug signing assets
        script: |
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles || true
          security find-identity -v -p codesigning || true
      
      - name: Build iOS archive
        script: |
          flutter build ipa --release --no-codesign --build-number=$BUILD_NUMBER --build-name=4.0.8

      - name: Build Android AAB
        script: flutter build appbundle
        
      - name: Export IPA (force profile)
        script: |
          PROFILE=$(ls -1 ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n 1)
          echo "Profile file: $PROFILE"

          UUID=$(security cms -D -i "$PROFILE" | plutil -extract UUID raw -)
          NAME=$(security cms -D -i "$PROFILE" | plutil -extract Name raw -)
          echo "Profile Name: $NAME"
          echo "Profile UUID: $UUID"

          cat <<EOF > $HOME/export_options.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>928C32BL78</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>br.com.celtaware.inventario</key>
              <string>$NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist $HOME/export_options.plist

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/ios/ipa/*.ipa

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
      app_store_connect:
        auth: integration
        submit_to_testflight: true